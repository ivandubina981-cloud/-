<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e0e5ec;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 1.8rem;
            color: #1a1a2e;
            margin-bottom: 0.25rem;
        }

        .sub {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
        }

        .search-section {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .search-section input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
        }

        .search-section input:focus {
            border-color: #4a6fa5;
        }

        .search-section button {
            padding: 0.75rem 1.5rem;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-section button:hover {
            background: #3a5a8a;
        }

        .current {
            background: #f5f7fb;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .city-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .temp {
            font-size: 4rem;
            font-weight: 700;
            color: #1a1a2e;
            margin: 0.5rem 0;
        }

        .temp span {
            font-size: 1.5rem;
            font-weight: 400;
        }

        .desc {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        .details {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .detail {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #555;
            font-size: 0.9rem;
        }

        .detail i {
            width: 1.2rem;
            color: #4a6fa5;
        }

        .forecast-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 1rem;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }

        .forecast-card {
            background: #f5f7fb;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .forecast-day {
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .forecast-icon {
            font-size: 1.8rem;
            margin: 0.5rem 0;
            color: #4a6fa5;
        }

        .forecast-temp {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a2e;
        }

        .forecast-temp-min {
            font-size: 0.85rem;
            color: #888;
            margin-left: 0.25rem;
            font-weight: 400;
        }

        .forecast-desc {
            font-size: 0.7rem;
            color: #666;
            text-transform: capitalize;
            margin-top: 0.25rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 0.75rem;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            font-size: 0.7rem;
            color: #888;
        }

        @media (max-width: 600px) {
            .container {
                padding: 1rem;
            }
            .temp {
                font-size: 3rem;
            }
            .forecast-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌤️ Прогноз погоды</h1>
    <div class="sub">текущая погода и прогноз на 5 дней</div>

    <div class="search-section">
        <input type="text" id="cityInput" placeholder="Название города" value="Москва">
        <button id="searchBtn">Поиск</button>
    </div>

    <div id="weatherContent">
        <div class="loading">Загрузка...</div>
    </div>

    <div class="footer">
        Данные: Open-Meteo
    </div>
</div>

<script>
    function getWeatherInfo(code) {
        const map = {
            0: { desc: "Ясно", icon: "fa-sun" },
            1: { desc: "Малооблачно", icon: "fa-cloud-sun" },
            2: { desc: "Переменная облачность", icon: "fa-cloud-sun" },
            3: { desc: "Пасмурно", icon: "fa-cloud" },
            45: { desc: "Туман", icon: "fa-smog" },
            51: { desc: "Морось", icon: "fa-cloud-rain" },
            53: { desc: "Морось", icon: "fa-cloud-rain" },
            55: { desc: "Морось", icon: "fa-cloud-rain" },
            61: { desc: "Дождь", icon: "fa-cloud-rain" },
            63: { desc: "Дождь", icon: "fa-cloud-rain" },
            65: { desc: "Дождь", icon: "fa-cloud-showers-heavy" },
            71: { desc: "Снег", icon: "fa-snowflake" },
            73: { desc: "Снег", icon: "fa-snowflake" },
            75: { desc: "Снег", icon: "fa-snowflake" },
            80: { desc: "Ливень", icon: "fa-cloud-showers-heavy" },
            95: { desc: "Гроза", icon: "fa-bolt" }
        };
        return map[code] || { desc: "Облачно", icon: "fa-cloud" };
    }

    function formatDay(dateStr) {
        const days = ['ВС', 'ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ'];
        const date = new Date(dateStr);
        return `${days[date.getDay()]} ${date.getDate()}`;
    }

    async function getWeather(city) {
        const content = document.getElementById('weatherContent');
        content.innerHTML = '<div class="loading">Загрузка...</div>';

        try {
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
            const geoData = await geoRes.json();
            if (!geoData.length) throw new Error('Город не найден');

            const lat = geoData[0].lat;
            const lon = geoData[0].lon;
            const cityName = geoData[0].display_name.split(',')[0];

            const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`);
            const data = await weatherRes.json();

            const current = data.current_weather;
            const daily = data.daily;
            const wInfo = getWeatherInfo(current.weathercode);
            const temp = Math.round(current.temperature);
            const windDir = current.winddirection;
            const dirs = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
            const windText = dirs[Math.round(windDir / 45) % 8] || '?';

            let forecastHtml = '';
            for (let i = 1; i <= 5 && i < daily.time.length; i++) {
                const fInfo = getWeatherInfo(daily.weathercode[i]);
                forecastHtml += `
                    <div class="forecast-card">
                        <div class="forecast-day">${formatDay(daily.time[i])}</div>
                        <div class="forecast-icon"><i class="fas ${fInfo.icon}"></i></div>
                        <div class="forecast-temp">${Math.round(daily.temperature_2m_max[i])}°<span class="forecast-temp-min">/${Math.round(daily.temperature_2m_min[i])}°</span></div>
                        <div class="forecast-desc">${fInfo.desc}</div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="current">
                    <div class="city-name">${cityName}</div>
                    <div class="temp">${temp}°<span>C</span></div>
                    <div class="desc"><i class="fas ${wInfo.icon}"></i> ${wInfo.desc}</div>
                    <div class="details">
                        <div class="detail"><i class="fas fa-wind"></i> Ветер: ${current.windspeed} м/с, ${windText}</div>
                        <div class="detail"><i class="fas fa-calendar"></i> ${new Date().toLocaleDateString('ru-RU')}</div>
                    </div>
                </div>
                <div class="forecast-title">📅 Прогноз на 5 дней</div>
                <div class="forecast-grid">${forecastHtml}</div>
            `;
        } catch (err) {
            content.innerHTML = `<div class="error">❌ ${err.message}</div>`;
        }
    }

    const input = document.getElementById('cityInput');
    const btn = document.getElementById('searchBtn');

    btn.addEventListener('click', () => getWeather(input.value.trim() || 'Москва'));
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') getWeather(input.value.trim() || 'Москва');
    });

    getWeather('Москва');
</script>
</body>
</html>
